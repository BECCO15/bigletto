<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Autoguidovie</title>
<style>
  :root {
    --verde: #1f6b3f;
    --verde-scuro: #1f6b3f;
    --bordo: #d9dfe3;
    --grigio-box: #f1f4f6;
    --testo: #111;
    --blu-logo: #12307a;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--verde);
    font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--testo);
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Intestazione */
  .top {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    padding: 18px 12px 22px;
    color: #fff;
  }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; text-align: center; }
  .back {
    background: none; border: 0; padding: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: flex-start;
  }
  .back svg { width: 22px; height: 22px; }

  /* Parte bianca */
  .sheet {
    background: #fff;
    border-radius: 10px;
    margin: 0 14px calc(28px + env(safe-area-inset-bottom, 0px));
    padding: 24px 20px 22px;
  }
  .logo { display: block; height: 12px; margin-bottom: 15px; }
  .titolo { margin: 0 0 20px; font-size: 22px; font-weight: 700; color: #000; }

  /* Box espandibili */
  .box {
    background: var(--grigio-box);
    border: 1px solid var(--bordo);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .box-head {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    background: none; border: 0; padding: 16px 18px;
    font: inherit; font-size: 17px; font-weight: 600; color: var(--testo);
    cursor: pointer; text-align: left;
  }
  .box-head .icona { width: 34px; height: 34px; flex: none; }
  .box-head .testo { flex: 1; }
  .box-head .freccia { width: 20px; height: 20px; flex: none; transition: transform .25s; }
  .box.aperto .freccia { transform: rotate(180deg); }
  .box-head:focus-visible { outline: 3px solid var(--verde); outline-offset: -3px; }

  .box-corpo { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .box.aperto .box-corpo { grid-template-rows: 1fr; }
  .box-corpo > div { overflow: hidden; }
  .contenuto { padding: 4px 18px 20px; }

  /* Info tessera */
  .tessera { display: flex; gap: 16px; align-items: flex-start; }
  .foto-gatto { width: 100px; height: 100px; object-fit: cover; background: #e3e9ec; flex: none; margin: 13px;}
  .nome { font-size: 15px; font-weight: 700; margin: 2px 0 0; }
  .razza { font-size: 15px; font-weight: 400; margin: 1px 0 9px; }
  .etichetta { font-size: 12px; font-weight: 400; margin: 0; color: #444; }
  .valore { font-size: 15px; font-weight: 700; margin: 1px 0 8px; }

  /* Controllo / QR */
  .qr-wrap { background:--grigio-box; border: 1px ; border-radius: 6px; padding: 18px; width: min(240px, 80%); margin: 6px auto 16px; }
  .qr-wrap img { display: block; width: 100%; height: auto; }
  .riga-timer { display: flex; align-items: center; justify-content: space-between; color: #0b356c; }
  .timer { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .timer svg { width: 26px; height: 26px; }
  .codice { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
  .codice svg { width: 14px; height: 14px; }

  /* Casella verde non premibile */
  .info-verde {
    background: var(--verde-scuro);
    color: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 22px;
    line-height: 1.5;
  }
  .info-verde strong { font-size: 15px; }

  /* Emesso / Costo */
  .emesso-label { font-size: 15px; margin: 0; color: #333; }
  .emesso-data { font-size: 16px; font-weight: 700; margin: 2px 0 18px; }
  .costo { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; }
  .costo b { font-weight: 700; }
  .costo span { font-weight: 400; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 18px 0 14px; }
  .codice-ticket { display: flex; justify-content: space-between; font-size: 13px; font-weight: 300; color: #333; }

  @media (prefers-reduced-motion: reduce) {
    .box-corpo, .freccia { transition: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <button class="back" type="button" aria-label="Indietro">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>
    </button>
    <h1>Ticket attivo</h1>
    <span></span>
  </header>

  <main class="sheet">
    <img class="logo" id="logo" src="foto_bigletto/Logo_Autoguidovie.png" alt="Logo">
    <h2 class="titolo">Annuale Studenti extra BG-V10 <br> tratta C</h2>

    <!-- Box 1: Info tess -->
    <section class="box" id="box-info">
      <button class="box-head" type="button" aria-expanded="false">
        <svg class="icona" viewBox="0 0 34 34" fill="none" stroke="#0b5a7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <rect x="3" y="7" width="28" height="20" rx="3"/>
          <circle cx="12" cy="15" r="3"/>
          <path d="M7 23c1-3 3-4 5-4s4 1 5 4M21 14h6M21 19h6"/>
        </svg>
        <span class="testo">Informazioni tessera</span>
        <svg class="freccia" viewBox="0 0 24 24" fill="none" stroke="#0b5a7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>
      </button>
      <div class="box-corpo"><div>
        <div class="contenuto">
          <div class="tessera">
            <img class="foto-gatto" id="gatto" src="foto_bigletto/mirco.jpeg" alt="Foto tessera">
            <div>
              <p class="nome">MIRCO INTACCHI</p>
              <p class="razza">NTCMRC08D15L400N</p>
              <p class="etichetta">Tesserino n.</p>
              <p class="valore">156987462</p>
              <p class="etichetta">Scadenza</p>
              <p class="valore">25/08/2029</p>
            </div>
          </div>
        </div>
      </div></div>
    </section>

    <!-- Box 2: Controllo -->
    <section class="box" id="box-controllo">
      <button class="box-head" type="button" aria-expanded="false">
        <svg class="icona" viewBox="0 0 34 34" fill="none" stroke="#0b5a7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M3 11a2 2 0 0 0 0 4v-0M3 11v-2a2 2 0 0 1 2-2h24a2 2 0 0 1 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a3 3 0 0 0 0-6Z"/>
          <path d="M22 8v2M22 14v2M22 20v2" stroke-dasharray="1 3"/>
          <path d="M9 14h8M9 19h6"/>
        </svg>
        <span class="testo">Controllo e validazione</span>
        <svg class="freccia" viewBox="0 0 24 24" fill="none" stroke="#0b5a7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>
      </button>
      <div class="box-corpo"><div>
        <div class="contenuto">
          <div class="qr-wrap"><img src="foto_bigletto/qrmatto.png" alt="Codice QR"></div>
          <div class="riga-timer">
            <div class="timer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              <span id="timer">20:19:54</span>
            </div>
            <div class="codice">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <span>194</span>
            </div>
          </div>
        </div>
      </div></div>
    </section>

    <!-- Casella verde non premibile -->
    <p class="info-verde">
      Da <strong>URGNANO</strong> a <strong>DALMINE</strong> <br> valido dal <strong>12/09/2026 a 30/06/2028</strong>
    </p>

    <p class="emesso-label">Emesso il:</p>
    <p class="emesso-data">12/09/2026 - 16:40</p>

    <div class="costo"><span>Costo</span><b>553,00€</b></div>
    <hr>
    <div class="codice-ticket"><span>codice Ticket:</span><span>104/696710</span></div>
  </main>
</div>

<script>
  // Box espandibili
  document.querySelectorAll('.box').forEach(function (box) {
    var head = box.querySelector('.box-head');
    head.addEventListener('click', function () {
      var open = box.classList.toggle('aperto');
      head.setAttribute('aria-expanded', open);
    });
  });

  // Timer: parte da 20:19:54, sale per un minuto, poi riparte
  (function () {
    var base = 20 * 3600 + 19 * 60 + 54, el = document.getElementById('timer');
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var start = Date.now();
    function tick() {
      var s = Math.floor((Date.now() - start) / 1000) % 61;
      var t = base + s;
      el.textContent = p(Math.floor(t / 3600)) + ':' + p(Math.floor(t % 3600 / 60)) + ':' + p(t % 60);
    }
    tick();
    setInterval(tick, 250);
  })();
</script>
</body>
</html>
